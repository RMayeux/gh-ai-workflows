name: 'Doc Sync'
description: 'Synchronizes project documentation with code changes in a PR'
inputs:
  llm:
    description: 'LLM provider (openai, anthropic, gemini, mistral)'
    required: true
  model:
    description: 'LLM model name'
    required: true
  api-key:
    description: 'LLM API Key'
    required: true
  github-token:
    description: 'GitHub Token'
    required: true
  pull-number:
    description: 'PR Number (optional for audit mode)'
    required: false
  lookback-commits:
    description: 'Number of commits to look back if no audit PR is found'
    required: false
    default: '10'
  owner:
    description: 'Repo Owner'
    required: false
  repo:
    description: 'Repo Name'
    required: false
  doc-pattern:
    description: 'Regex to find documentation files in the repository'
    required: true
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Run Doc Sync Workflow
      shell: bash
      run: |
        export LLM="${{ inputs.llm }}"
        export MODEL="${{ inputs.model }}"
        export API_KEY="${{ inputs.api-key }}"
        export GITHUB_TOKEN="${{ inputs.github-token }}"
        export DEBUG="${{ inputs.debug }}"
        export GITHUB_REPOSITORY_OWNER="${{ inputs.owner || GITHUB_REPOSITORY%%/* }}"
        export GITHUB_REPOSITORY_NAME="${{ inputs.repo || GITHUB_REPOSITORY#*/ }}"
        export GITHUB_EVENT_PULL_REQUEST_NUMBER="${{ inputs.pull-number || github.event.pull_request.number }}"
        export DOC_PATTERN="${{ inputs.doc-pattern }}"
        export LOOKBACK_COMMITS="${{ inputs.lookback-commits }}"
        node ${{ github.action_path }}/../../dist/doc-sync.mjs
