name: 'PR Metadata'
description: 'Generates PR metadata using AI'
inputs:
  llm:
    description: 'LLM provider (openai, anthropic, gemini, mistral)'
    required: true
  model:
    description: 'LLM model name'
    required: true
  api-key:
    description: 'LLM API Key'
    required: true
  prompt-version:

    description: 'Version of the prompt to use'
    required: false
    default: '1.0.0'
  max-tokens:
    description: 'Maximum tokens for generation'
    required: false
    default: '4096'
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'
    - run: pnpm install --ignore-scripts
      shell: bash
    - run: pnpm build
      shell: bash
    - name: Run PR Metadata Workflow
      shell: bash
      run: |
        export LLM="${{ inputs.llm }}"
        export MODEL="${{ inputs.model }}"
        export API_KEY="${{ inputs.api-key }}"
        export GITHUB_TOKEN="${{ inputs.github-token }}"
        export PROMPT_VERSION="${{ inputs.prompt-version }}"
        export MAX_TOKENS="${{ inputs.max-tokens }}"
        export DEBUG="${{ inputs.debug }}"
        export GITHUB_REPOSITORY_OWNER="${GITHUB_REPOSITORY%%/*}"
        export GITHUB_REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
        export GITHUB_EVENT_PULL_REQUEST_NUMBER="${GITHUB_EVENT_PULL_REQUEST_NUMBER}"
        npx tsx scripts/pr-metadata.ts