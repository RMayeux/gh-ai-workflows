name: 'PR Metadata'
description: 'Generates PR metadata using AI'
inputs:
  llm:
    description: 'LLM provider (openai, anthropic, gemini, mistral)'
    required: true
  model:
    description: 'LLM model name'
    required: true
  api-key:
    description: 'LLM API Key'
    required: true
  prompt-version:
    description: 'Version of the prompt to use'
    required: false
    default: '1.0.0'
  max-tokens:
    description: 'Maximum tokens for generation'
    required: false
    default: '4096'
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@60fed60fb998719931a063aaa0f4f271976f5485 # v4.2.0
      with:
        node-version: '20'
    - name: Install Dependencies
      run: pnpm install
      shell: bash
    - name: Run PR Metadata Workflow
      run: npx tsx scripts/run-pr-metadata.ts
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        LLM: ${{ inputs.llm }}
        MODEL: ${{ inputs.model }}
        API_KEY: ${{ inputs.api-key }}
        PROMPT_VERSION: ${{ inputs.prompt-version }}
        MAX_TOKENS: ${{ inputs.max-tokens }}
        DEBUG: ${{ inputs.debug }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
