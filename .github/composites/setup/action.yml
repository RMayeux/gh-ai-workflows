name: 'Common Setup'
description: 'Shared setup for all workflows including checkout, Node.js and pnpm'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'
    - run: pnpm install --ignore-scripts
      shell: bash
    - run: pnpm bundle
      shell: bash
