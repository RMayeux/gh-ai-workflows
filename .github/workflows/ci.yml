name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: ./.github/composites/setup

      - name: Type check
        id: tsc
        continue-on-error: true
        run: |
          if pnpm tsc --noEmit; then
            echo "result=✅ pnpm tsc --noEmit — no errors" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ pnpm tsc --noEmit — failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle
        id: bundle
        continue-on-error: true
        run: |
          if pnpm run bundle; then
            echo "result=✅ pnpm run bundle — all 4 features build successfully" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ pnpm run bundle — failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        id: test
        continue-on-error: true
        run: |
          pnpm test > /tmp/test_output.txt 2>&1
          if [ $? -eq 0 ]; then
            SUMMARY=$(grep -oP 'Tests\s+\K.*' /tmp/test_output.txt | tail -1)
            echo "result=✅ pnpm test — ${SUMMARY:-all tests pass}" >> "$GITHUB_OUTPUT"
          else
            SUMMARY=$(grep -oP 'Tests\s+\K.*' /tmp/test_output.txt | tail -1)
            echo "result=❌ pnpm test — ${SUMMARY:-failed}" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/test_output.txt

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          if pnpm lint; then
            echo "result=✅ pnpm lint — no errors" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ pnpm lint — failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Verification Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="## Verification

    ${{ steps.tsc.outputs.result }}
    ${{ steps.bundle.outputs.result }}
    ${{ steps.test.outputs.result }}
    ${{ steps.lint.outputs.result }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            COMMENT_ID=$(gh api "/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | startswith("## Verification")) | .id' | head -1)

            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
                -f body="$BODY"
            else
              gh pr comment "$PR_NUMBER" --body "$BODY"
            fi
          fi

          if [[ "${{ steps.tsc.outcome }}" != "success" || \
                "${{ steps.bundle.outcome }}" != "success" || \
                "${{ steps.test.outcome }}" != "success" || \
                "${{ steps.lint.outcome }}" != "success" ]]; then
            exit 1
          fi
