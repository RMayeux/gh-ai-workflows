name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: ./.github/composites/setup

      - name: TypeScript type checking
        id: typecheck
        continue-on-error: true
        run: |
          start=$(date +%s)
          if pnpm tsc --noEmit; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
          echo "elapsed=$(( $(date +%s) - start ))s" >> "$GITHUB_OUTPUT"

      - name: ESLint
        id: lint
        continue-on-error: true
        run: |
          start=$(date +%s)
          if pnpm lint; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
          echo "elapsed=$(( $(date +%s) - start ))s" >> "$GITHUB_OUTPUT"

      - name: Vitest
        id: test
        continue-on-error: true
        run: |
          start=$(date +%s)
          pnpm test --reporter=json > /tmp/vitest.json 2>/tmp/vitest.log
          cat /tmp/vitest.log
          node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/vitest.json', 'utf8'));
            const passes = r.numPassedTests || 0;
            const failures = r.numFailedTests || 0;
            const total = passes + failures;
            require('fs').appendFileSync(
              process.env.GITHUB_OUTPUT,
              'result=' + (failures ? 'fail' : 'pass') + '\n' +
              'summary=' + (failures ? passes + '/' + total : total) + '\n'
            );
          "
          echo "elapsed=$(( $(date +%s) - start ))s" >> "$GITHUB_OUTPUT"

      - name: Update PR description
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          emoji() { [[ "$1" == "success" ]] && printf '✓' || printf '✗'; }

          {
            printf '%-1s %-6s %s\n' \
              "$(emoji ${{ steps.typecheck.outcome }})" \
              "type" \
              "${{ steps.typecheck.outputs.elapsed }}"
            printf '%-1s %-6s %s\n' \
              "$(emoji ${{ steps.lint.outcome }})" \
              "lint" \
              "${{ steps.lint.outputs.elapsed }}"
            printf '%-1s %-6s %s  (%s)\n' \
              "$(emoji ${{ steps.test.outcome }})" \
              "tests" \
              "${{ steps.test.outputs.elapsed }}" \
              "${{ steps.test.outputs.summary }}"
          } > /tmp/vtable

          PR_BODY=$(gh api "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body')

          if echo "${PR_BODY:-}" | grep -q '## Verification'; then
            PREAMBLE=$(printf '%s' "$PR_BODY" | sed '/^## Verification/q' | sed '$d')
          else
            PREAMBLE="${PR_BODY:-}"
          fi

          {
            printf '%s\n\n' "$PREAMBLE"
            echo '## Verification'
            echo ''
            echo '```'
            cat /tmp/vtable
            echo '```'
          } > /tmp/pr_body

          gh api -X PATCH \
            "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            -f body="$(cat /tmp/pr_body)"

      - name: Report final status
        if: always()
        run: |
          [[ "${{ steps.typecheck.outcome }}" == "success" && \
             "${{ steps.lint.outcome }}" == "success" && \
             "${{ steps.test.outcome }}" == "success" ]]
