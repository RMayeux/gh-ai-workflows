name: Bundle Actions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'packages/*/src/**'

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: ./.github/composites/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle
      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "chore: rebuild dist [skip ci]"
          git push
