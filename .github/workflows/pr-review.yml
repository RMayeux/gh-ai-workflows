name: 'AI PR Review'

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@4.1.7

      - name: 'Run AI PR Review'
        uses: ./.github/workflows/pr-review # Note: This should point to the local action
        with:
          llm: 'openai'
          model: 'gpt-4o'
          api-key: ${{ secrets.OPENAI_API_KEY }}
          debug: 'true'
