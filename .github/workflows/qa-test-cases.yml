name: 'AI QA Test Cases'

on:
  workflow_dispatch:
  pull_request:
    types: [opened]

jobs:
  generate-qa:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - name: 'Run AI QA Test Cases'
        uses: ./features/qa-test-cases
        with:
          llm: 'gemini'
          model: 'gemma-4-31b-it'
          api-key: ${{ secrets.GEMINI_API_KEY }}
          project-context: 'This is a provider-agnostic AI GitHub Actions platform.'
          doc-pattern: 'docs/.*\.md'
          debug: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
