name: 'AI PR Metadata'

on:
  pull_request:
    types: [opened, labeled]

jobs:
  metadata:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name == 'update-metadata')
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - name: 'Run AI PR Metadata'
        uses: ./workflows/pr-metadata
        with:
          llm: 'gemini'
          model: 'gemma-4-31b-it'
          api-key: ${{ secrets.GEMINI_API_KEY }}
          debug: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}