# Example: Using Gemini (Default)
name: PR Metadata (Gemini)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  update-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: your-org/gh-ai-workflows/workflows/pr-metadata@v1
        with:
          llm: 'gemini'
          model: 'gemini-1.5-pro'
          api-key: ${{ secrets.GEMINI_API_KEY }}
