# Example: Monorepo Setup
# In a monorepo, you might want to run the workflow only when specific directories change.

name: Monorepo PR Metadata
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'

jobs:
  update-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: your-org/gh-ai-workflows/workflows/pr-metadata@v1
        with:
          llm: 'gemini'
          model: 'gemini-1.5-pro'
          api-key: ${{ secrets.GEMINI_API_KEY }}
          debug: 'true'
