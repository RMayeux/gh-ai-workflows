# Example: Using OpenAI
name: PR Metadata (OpenAI)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  update-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: your-org/gh-ai-workflows/workflows/pr-metadata@v1
        with:
          llm: 'openai'
          model: 'gpt-4o'
          api-key: ${{ secrets.OPENAI_API_KEY }}
          max-tokens: 2048
