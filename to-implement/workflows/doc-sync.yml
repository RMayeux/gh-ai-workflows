name: Doc Sync

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read last audited SHA
        id: last_sha
        run: |
          SHA=""

          # Strategy 1: read from bot/docs-sync branch
          if git ls-remote --exit-code origin bot/docs-sync > /dev/null 2>&1; then
            SHA=$(git show origin/bot/docs-sync:docs/.internal/.last-audited-sha 2>/dev/null | head -1 | tr -d '[:space:]')
          fi

          # Strategy 2: first commit on main (true baseline for first run)
          if [ -z "$SHA" ]; then
            SHA=$(git rev-list --max-parents=0 HEAD | head -1 | tr -d '[:space:]')
          fi

          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Diffing from $SHA to HEAD"

      - name: Extract diff since last audit
        run: |
          BASE_SHA="${{ steps.last_sha.outputs.sha }}"

          git diff --name-only "$BASE_SHA"...HEAD \
            ':!.github' ':!docs' ':!*.env*' ':!*.lock' \
            > /tmp/changed_files.txt

          git diff "$BASE_SHA"...HEAD \
            ':!.github' ':!docs' ':!*.env*' ':!*.lock' \
            > /tmp/code_diff.txt

          echo "Changed files:"
          cat /tmp/changed_files.txt

          # Skip if nothing business-relevant changed
          if [ ! -s /tmp/changed_files.txt ]; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Check for open doc sync PR
        id: existing_pr
        if: env.NO_CHANGES != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:bot/docs-sync`,
              state: 'open'
            });
            return prs.data.length > 0 ? prs.data[0].number : null;

      - name: Collect impacted feature docs
        if: env.NO_CHANGES != 'true'
        uses: ./.github/actions/collect-feature-docs
        with:
          changed_files_path: /tmp/changed_files.txt
          output_path: /tmp/existing_docs.txt

      - name: Load feature registry
        if: env.NO_CHANGES != 'true'
        run: |
          cat docs/.internal/feature-registry.json 2>/dev/null > /tmp/registry.json || echo '{}' > /tmp/registry.json

      - name: Build prompt
        if: env.NO_CHANGES != 'true'
        run: |
          python3 - << 'PYEOF'
          with open('.github/prompts/doc-sync.txt') as f:
              prompt = f.read()
          with open('/tmp/changed_files.txt') as f:
              changed_files = f.read()
          with open('/tmp/code_diff.txt') as f:
              code_diff = f.read()
          with open('/tmp/existing_docs.txt') as f:
              existing_docs = f.read()
          with open('/tmp/registry.json') as f:
              registry = f.read()

          prompt = prompt.replace('__CHANGED_FILES__', changed_files)
          prompt = prompt.replace('__CODE_DIFF__', code_diff[:120000])
          prompt = prompt.replace('__EXISTING_DOCS__', existing_docs)
          prompt = prompt.replace('__REGISTRY__', registry)

          with open('/tmp/prompt.txt', 'w') as f:
              f.write(prompt)
          PYEOF

      - name: Call LLM — generate doc changes
        if: env.NO_CHANGES != 'true'
        run: node .github/scripts/call-llm.js --json > /tmp/doc_changes.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT_FILE: /tmp/prompt.txt

      - name: Check if LLM flagged no changes needed
        if: env.NO_CHANGES != 'true'
        id: check_changes
        run: |
          python3 - << 'PYEOF'
          import json, os
          with open('/tmp/doc_changes.json') as f:
              data = json.load(f)
          changes = data.get('changes', [])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"HAS_DOC_CHANGES={'true' if changes else 'false'}\n")
          PYEOF

      - name: Setup bot/docs-sync branch
        if: env.NO_CHANGES != 'true' && env.HAS_DOC_CHANGES == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reset or create bot/docs-sync from main
          git fetch origin bot/docs-sync 2>/dev/null || true
          git checkout -B bot/docs-sync HEAD

      - name: Apply doc changes to disk
        if: env.NO_CHANGES != 'true' && env.HAS_DOC_CHANGES == 'true'
        run: node .github/scripts/apply-doc-changes.js /tmp/doc_changes.json

      - name: Write last audited SHA
        if: env.NO_CHANGES != 'true' && env.HAS_DOC_CHANGES == 'true'
        run: |
          mkdir -p docs/.internal
          echo "${{ github.sha }}" > docs/.internal/.last-audited-sha

      - name: Commit and force-push
        if: env.NO_CHANGES != 'true' && env.HAS_DOC_CHANGES == 'true'
        run: |
          git add docs/
          git commit -m "docs: sync from main up to ${{ github.sha }}" || echo "Nothing to commit"
          git push origin bot/docs-sync --force

      - name: Build PR body
        if: env.NO_CHANGES != 'true' && env.HAS_DOC_CHANGES == 'true'
        id: pr_body
        run: |
          python3 - << 'PYEOF'
          import json, os

          with open('/tmp/doc_changes.json') as f:
              data = json.load(f)

          changes = data.get('changes', [])
          summary = data.get('summary', '')

          lines = [
            "## 📄 Documentation sync",
            "",
            summary,
            "",
            "### Changes",
          ]
          for c in changes:
              action_icon = {"create": "✅ Created", "update": "🔄 Updated", "delete": "🗑️ Deleted"}.get(c['action'], c['action'])
              lines.append(f"- {action_icon}: `{c['path']}`")

          lines += [
            "",
            f"---",
            f"_Auto-generated from commits up to {os.environ['GITHUB_SHA'][:8]}_"
          ]

          body = "\n".join(lines)
          env_file = os.environ['GITHUB_OUTPUT']
          with open(env_file, 'a') as f:
              f.write(f"body<<EOF\n{body}\nEOF\n")
          PYEOF

      - name: Create or update doc sync PR
        if: env.NO_CHANGES != 'true' && env.HAS_DOC_CHANGES == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_BODY: ${{ steps.pr_body.outputs.body }}
          EXISTING_PR: ${{ steps.existing_pr.outputs.result }}
        with:
          script: |
            const body = process.env.PR_BODY;
            const existingPr = process.env.EXISTING_PR !== 'null' ? Number(process.env.EXISTING_PR) : null;

            if (existingPr) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: existingPr,
                body
              });
              console.log(`Updated existing PR #${existingPr}`);
            } else {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'docs: sync feature documentation',
                body,
                head: 'bot/docs-sync',
                base: 'main'
              });
              console.log('Created new doc sync PR');
            }

      - name: Update last audited SHA even if no doc changes
        if: env.NO_CHANGES != 'true' && env.HAS_DOC_CHANGES == 'false'
        run: |
          echo "No doc changes needed — SHA will be audited on next meaningful diff"