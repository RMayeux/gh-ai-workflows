name: Collect impacted feature docs
description: Matches changed files to feature docs using path-aware slug resolution

inputs:
  changed_files_path:
    description: Path to file containing list of changed files (one per line)
    required: true
  output_path:
    description: Path to write collected doc content
    required: true
    default: /tmp/feature_docs.txt

runs:
  using: composite
  steps:
    - name: Resolve and collect docs
      shell: bash
      run: |
        DOC_CONTENT=""
        MATCHED_DOCS=""

        while IFS= read -r file; do
          [ -z "$file" ] && continue
          DOC=""

          # Strategy 1: path contains features/ — extract domain/feature from path
          if echo "$file" | grep -q 'features/'; then
            SLUG=$(echo "$file" | sed 's|.*/features/||; s|\.[^.]*$||')
            DOC=$(find docs/features -path "*${SLUG}.md" 2>/dev/null | head -1)
          fi

          # Strategy 2: bare filename match
          if [ -z "$DOC" ]; then
            BASENAME=$(echo "$file" | sed 's|.*/||; s|\.[^.]*$||')
            DOC=$(find docs/features -name "${BASENAME}.md" 2>/dev/null | head -1)
          fi

          # Strategy 3: parent directory = domain slug, look for _index.md
          if [ -z "$DOC" ]; then
            PARENT=$(dirname "$file" | sed 's|.*/||')
            DOC=$(find docs/features -path "*${PARENT}/_index.md" 2>/dev/null | head -1)
          fi

          if [ -n "$DOC" ] && ! echo "$MATCHED_DOCS" | grep -q "$DOC"; then
            MATCHED_DOCS="$MATCHED_DOCS $DOC"
            DOC_CONTENT="$DOC_CONTENT\n\n--- FILE: $DOC ---\n$(cat "$DOC")"
          fi
        done < "${{ inputs.changed_files_path }}"

        # Fallback: load all feature docs if nothing matched
        if [ -z "$DOC_CONTENT" ]; then
          for doc in $(find docs/features -name "*.md" 2>/dev/null); do
            DOC_CONTENT="$DOC_CONTENT\n\n--- FILE: $doc ---\n$(cat "$doc")"
          done
        fi

        echo -e "$DOC_CONTENT" > "${{ inputs.output_path }}"
